openapi: 3.0.3
info:
  title: Backend Challenge API
  description: REST API for managing trips, bookings, payments, and travelers with JWT authentication
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Development server

tags:
  - name: Authentication
    description: User authentication endpoints
  - name: Trips
    description: Trip management endpoints

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT token from /auth/login"

  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "test@example.com"
        password:
          type: string
          format: password
          example: "password123"

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT token (valid 24 hours)
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        user:
          type: object
          properties:
            id:
              type: integer
            email:
              type: string
            organization_id:
              type: integer

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - organization_name
      properties:
        email:
          type: string
          format: email
          example: "newuser@example.com"
        password:
          type: string
          format: password
          minLength: 8
          example: "securepassword123"
        organization_name:
          type: string
          minLength: 1
          example: "My Company"
          description: "Name of the organization to create"

    Trip:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        destination:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time

    TripCreate:
      type: object
      required:
        - title
        - destination
        - start_date
        - end_date
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        destination:
          type: string
          minLength: 1
          maxLength: 255
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date

    ShareTripRequest:
      type: object
      properties:
        organization_id:
          type: integer
          nullable: true
          description: ID of organization to share trip with (mutually exclusive with user_id)
        user_id:
          type: integer
          nullable: true
          description: ID of specific user to share trip with (mutually exclusive with organization_id)
      description: Either organization_id or user_id must be provided, but not both

    TripPermission:
      type: object
      properties:
        id:
          type: integer
        trip_id:
          type: integer
        organization_id:
          type: integer
          nullable: true
          description: Organization with access (null if user-specific)
        user_id:
          type: integer
          nullable: true
          description: Specific user with access (null if organization-wide)
        created_at:
          type: string
          format: date-time

paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register new user
      description: Create a new user account with a new organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '409':
          description: Email already exists
        '400':
          description: Validation error

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login
      description: Authenticate and receive JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
        '400':
          description: Validation error

  /trips:
    get:
      tags:
        - Trips
      summary: List trips
      parameters:
        - name: destination
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of trips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'

    post:
      tags:
        - Trips
      summary: Create trip (protected)
      description: Requires authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripCreate'
      responses:
        '201':
          description: Trip created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '401':
          description: Unauthorized
        '400':
          description: Validation error

  /trips/{id}:
    get:
      tags:
        - Trips
      summary: Get trip (protected)
      description: Requires authentication. Only accessible if user's organization has permission or user has been granted specific access.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Trip details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '401':
          description: Unauthorized
        '403':
          description: Access denied - organization does not have permission
        '404':
          description: Not found

    put:
      tags:
        - Trips
      summary: Update trip (protected)
      description: Requires authentication. Only accessible if user's organization has permission or user has been granted specific access.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripCreate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '401':
          description: Unauthorized
        '403':
          description: Access denied - organization does not have permission
        '404':
          description: Not found

    delete:
      tags:
        - Trips
      summary: Delete trip
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found

  /trips/{id}/share:
    post:
      tags:
        - Trips
      summary: Share trip with organization or user (protected)
      description: Grant an organization or specific user access to view and update a trip. Provide either organization_id (org-wide access) or user_id (user-specific access), but not both. Requires authentication.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Trip ID to share
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareTripRequest'
      responses:
        '201':
          description: Trip successfully shared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripPermission'
        '400':
          description: Validation error or invalid trip ID
        '401':
          description: Unauthorized
        '404':
          description: Trip not found
        '409':
          description: Trip already shared with this organization or user
